<template data-doc="geoportal-nueva-imperial">
  <h1>Geoportal Nueva Imperial — Proto-IDE</h1>
  <p class="sub">Proyecto propio · geoportal administrable</p>
  <p>Geoportal territorial multi-categoría construido sobre una base de datos PostGIS (Supabase). Una portada-catálogo lista las categorías y un visor único navega entre ellas recargando mapa, indicadores, tabla, leyenda y ficha. El contenido público/privado lo controla la propia base de datos vía RLS —no una URL aparte—, e incluye edición de puntos desde la web y un panel de administración del catálogo para el rol admin. Frontend vanilla con ES modules, sin herramientas de compilación.</p>
  <div class="tags"><span class="tag">MapLibre GL JS</span><span class="tag">Supabase</span><span class="tag">PostGIS</span><span class="tag">RLS</span><span class="tag">JavaScript</span></div>
</template>

  <p class="sub">Repositorio · GitHub</p>
  <p>Visor web autocontenido que consulta la API de Wikimapia y muestra los lugares registrados en cada una de las 33 comunas de la Región de O'Higgins, sobre un mapa. Los límites comunales se obtienen al vuelo desde OpenStreetMap / Nominatim. Resuelve el transporte de la API antigua con descubrimiento automático de JSONP.</p>

<template data-doc="sig">
  <h1>Sistemas de información geográfica</h1>
  <h2>Herramientas</h2>
  <ul>
    <li><b>QGIS</b> — cartografía de producción, composición de layouts institucionales, simbología.</li>
    <li><b>PyQGIS</b> — automatización de exportaciones por atributo, generación de plantillas, procesos por lote.</li>
    <li><b>GDAL</b> — georreferenciación, transformación de formatos, procesamiento raster desde consola.</li>
  </ul>
  <h2>Análisis</h2>
  <ul>
    <li>Cálculo de distancias y análisis de proximidad para consultas de pertinencia ambiental.</li>
    <li>Manejo de sistemas de referencia y reproyección entre marcos locales y globales.</li>
    <li>Agregación de datos censales a unidades territoriales.</li>
  </ul>
</template>

<template data-doc="datos">
  <h1>Análisis de datos</h1>
  <ul>
    <li><b>R</b> — dplyr, tidyr, stringr para consolidación y limpieza de datos irregulares.</li>
    <li><b>ggplot2</b> — visualización estadística y gráficos para publicaciones institucionales.</li>
    <li><b>Shiny</b> — aplicaciones interactivas de exploración de datos censales.</li>
    <li><b>Parquet</b> — trabajo con volúmenes grandes de microdatos.</li>
  </ul>
  <p>Trabajo frecuente: consolidar cientos de planillas con estructuras de carpetas irregulares y conflictos de tipos de columna en una tabla única y confiable. No es glamoroso, pero es donde se gana o se pierde un proyecto.</p>
</template>

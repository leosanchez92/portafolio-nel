<template data-doc="perfil-profesional">
  <h1>Nel — Especialista GIS y Cartógrafo</h1>
  <p class="sub">Región de O'Higgins, Chile</p>
  <p>Trabajo en la intersección entre el dato territorial y las personas que lo necesitan usar. Mi día a día combina procesamiento de datos censales, diseño cartográfico institucional y desarrollo de herramientas web que ponen la información geográfica en manos de quien toma decisiones.</p>
  <p>Me interesa especialmente el problema de la <b>última milla</b> del dato geoespacial: no basta con tener la capa correcta si nadie puede abrirla. Por eso la mayoría de mis herramientas son archivos HTML autocontenidos que funcionan sin servidor, sin instalación y sin conexión — se abren con doble clic y listo.</p>
  <h2>Cómo trabajo</h2>
  <ul>
    <li><b>Configuración sobre código.</b> Separo el contenido de la estructura con archivos de configuración, para que el equipo pueda actualizar sin tocar la lógica.</li>
    <li><b>Herramientas que sobreviven sin mí.</b> Documento convenciones y dejo generadores, no entregables únicos.</li>
    <li><b>Diseño con criterio institucional.</b> Paleta, tipografía y jerarquía consistentes en cada producto.</li>
  </ul>
  <h2>Fuera de la pantalla</h2>
  <p>Fotografía análoga en 35 mm, cultura gaming retro y entrenamiento de fuerza. Este portafolio no es casualidad.</p>
</template>

<template data-doc="generador-censal">
  <h1>Generador de visores censales</h1>
  <p class="sub">INE O'Higgins · Herramienta interna</p>
  <h2>El problema</h2>
  <p>Cada requerimiento de datos censales a nivel de manzana terminaba en un archivo plano que el solicitante no podía interpretar espacialmente. Producir un visor a medida por cada solicitud no escalaba.</p>
  <h2>La solución</h2>
  <p>Un generador que recibe el GeoJSON y la configuración del requerimiento, y devuelve un visor HTML completo y autónomo, listo para enviar por correo.</p>
  <ul>
    <li>Detección automática de EPSG y reproyección con proj4js.</li>
    <li>Coropleta por cuantiles con tratamiento explícito de "sin datos".</li>
    <li>Indicadores configurables y renombrado de campos técnicos a nombres legibles.</li>
    <li>Plantilla del visor incrustada, sin dependencias externas.</li>
  </ul>
  <div class="tags"><span class="tag">JavaScript</span><span class="tag">MapLibre GL JS</span><span class="tag">proj4js</span><span class="tag">GeoJSON</span></div>
</template>

<template data-doc="ipc">
  <h1>Sistema de visores de terreno IPC</h1>
  <p class="sub">INE O'Higgins · Dos generaciones (V1 → V2)</p>
  <p>Herramienta que produce visores autocontenidos para la recolección en terreno del IPC, pensados para funcionar en equipos sin conexión ni permisos de instalación.</p>
  <h2>Decisiones de diseño</h2>
  <ul>
    <li>Filtros multiselección por semana de recolección.</li>
    <li>Mapas base vectoriales con marcadores HTML en lugar de capas de símbolos GPU: la carga de glifos falla al abrir desde el disco, y la fidelidad visual no era negociable.</li>
    <li>Paginador para puntos que agrupan varios registros en la misma coordenada.</li>
  </ul>
  <h2>Aprendizaje</h2>
  <p>La restricción técnica más dura resultó ser la más productiva: diseñar para que funcione sin servidor obliga a decisiones honestas sobre peso, dependencias y carga cognitiva.</p>
  <div class="tags"><span class="tag">JavaScript</span><span class="tag">MapLibre GL JS</span><span class="tag">UX geoespacial</span></div>
</template>

<template data-doc="pesca">
  <h1>Storymap de desembarque pesquero</h1>
  <p class="sub">INE O'Higgins</p>
  <p>Pieza de narrativa espacial que recorre los datos de desembarque en ocho localidades de la costa regional, distinguiendo caletas de puntos de desembarque.</p>
  <ul>
    <li>Consolidación de datos 2023–2025 con financiamiento GORE / INDESPA.</li>
    <li>Indicadores por localidad y tipología.</li>
    <li>Estimación de coordenadas documentada explícitamente donde el dato original no existía.</li>
  </ul>
  <p>El principio que guió la pieza: cuando un dato es estimado, se declara. La transparencia metodológica es parte del diseño, no una nota al pie.</p>
  <div class="tags"><span class="tag">Storymap</span><span class="tag">MapLibre GL JS</span><span class="tag">GeoJSON</span></div>
</template>

<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio — Explorador</title>
<style>
/* ============================================================
   SISTEMA VISUAL WINDOWS 98
   ============================================================ */
:root{
  --gris:#c0c0c0;
  --gris-osc:#808080;
  --gris-claro:#dfdfdf;
  --blanco:#ffffff;
  --negro:#000000;
  --navy:#000080;
  --azul:#1084d0;
  --teal:#008080;
  --sel:#000080;
  --fuente:"Pixelated MS Sans Serif","MS Sans Serif",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--fuente);
  font-size:11px;
  background:var(--teal);
  overflow:hidden;
  user-select:none;
  -webkit-font-smoothing:none;
}
button{font-family:var(--fuente);font-size:11px;cursor:default}

/* --- Relieves clásicos --- */
.out{
  border:1px solid;
  border-color:var(--gris-claro) var(--negro) var(--negro) var(--gris-claro);
  box-shadow:inset 1px 1px 0 var(--blanco), inset -1px -1px 0 var(--gris-osc);
  background:var(--gris);
}
.in{
  border:1px solid;
  border-color:var(--gris-osc) var(--blanco) var(--blanco) var(--gris-osc);
  box-shadow:inset 1px 1px 0 var(--negro), inset -1px -1px 0 var(--gris-claro);
  background:var(--blanco);
}
.presionado{
  border-color:var(--negro) var(--gris-claro) var(--gris-claro) var(--negro)!important;
  box-shadow:inset 1px 1px 0 var(--gris-osc), inset -1px -1px 0 var(--blanco)!important;
}

/* --- Barras de desplazamiento Win98 ---
   Adaptado de os-gui (MIT, © Isaiah Odhner, https://github.com/1j01/os-gui):
   pista con trama de tablero, botones con flechas pixeladas y pulgar en relieve. */
:root{
  --trama:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAG0lEQVQYV2P8/////4MHDzIwHjhw4L+9vT0DAHAFCj6esq3FAAAAAElFTkSuQmCC");
  --flechas-scroll:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACQAAAAJCAYAAABaMo5wAAAAW0lEQVQ4T2NkGGSAcZC5h4FWDvrPwEC02ShqkR0EkkAHuBxMyEKYWYQ8jKEOXQOyo/A5BuZwqqvBZiA+3xMbilQLIWqlcUJRimwPzjRELcdQZA6hREeR4eRoBgBoXhAK6oiMhwAAAABJRU5ErkJggg==");
}
/* Aproximación para Firefox. OJO: solo ahí — declarar scrollbar-color en
   Chrome/Edge desactiva los estilos ::-webkit-scrollbar de abajo. */
@supports not selector(::-webkit-scrollbar){
  html{scrollbar-color:var(--gris) var(--gris-claro)}
}
::-webkit-scrollbar,
::-webkit-scrollbar-thumb,
::-webkit-scrollbar-button{width:13px;height:13px}
::-webkit-scrollbar{background:var(--trama) repeat;image-rendering:pixelated}
::-webkit-scrollbar-thumb{
  background-color:var(--gris);
  border-top:1px solid var(--gris); border-left:1px solid var(--gris);
  border-right:1px solid var(--negro); border-bottom:1px solid var(--negro);
  box-shadow:inset 1px 1px 0 var(--blanco), inset -1px -1px 0 var(--gris-osc);
}
::-webkit-scrollbar-corner{background:var(--gris)}
::-webkit-scrollbar-button{
  background-color:var(--gris);
  border-top:1px solid var(--gris); border-left:1px solid var(--gris);
  border-right:1px solid var(--negro); border-bottom:1px solid var(--negro);
  box-shadow:inset 1px 1px 0 var(--blanco), inset -1px -1px 0 var(--gris-osc);
  background-image:var(--flechas-scroll);
  image-rendering:pixelated; box-sizing:border-box;
}
::-webkit-scrollbar-button:hover:active{border:1px solid var(--gris-osc);box-shadow:none}
::-webkit-scrollbar-button:horizontal:decrement{background-position:calc(9px * -3 + 1px) 1px}
::-webkit-scrollbar-button:horizontal:increment{background-position:calc(9px * -2 + 1px) 1px}
::-webkit-scrollbar-button:vertical:decrement{background-position:calc(9px * -1 + 1px) 1px}
::-webkit-scrollbar-button:vertical:increment{background-position:1px 1px}
/* sin botones dobles, como en el original */
::-webkit-scrollbar-button:start:increment,
::-webkit-scrollbar-button:end:decrement{display:none}

/* ============================================================
   ESCRITORIO
   ============================================================ */
#escritorio{
  position:absolute; inset:0 0 28px 0;
  background:var(--teal) url("img/escritorio/nubes.jpg") center/cover no-repeat;
  padding:6px;
}
.icono-escritorio{
  width:76px; padding:4px 2px 2px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  margin-bottom:8px; cursor:default;
}
.icono-escritorio img,.icono-escritorio svg{width:32px;height:32px;image-rendering:pixelated}
.icono-escritorio .etq{
  color:#fff; text-align:center; line-height:1.25; padding:1px 3px;
  background:var(--teal);
}
.icono-escritorio.activo .etq{background:var(--sel);text-shadow:none;outline:1px dotted #fff}
.icono-escritorio.activo .marco{filter:hue-rotate(180deg) saturate(1.4) brightness(.85)}

/* ============================================================
   VENTANAS
   ============================================================ */
.ventana{
  position:absolute;
  background:var(--gris);
  border:1px solid;
  border-color:var(--gris-claro) var(--negro) var(--negro) var(--gris-claro);
  box-shadow:inset 1px 1px 0 var(--blanco), inset -1px -1px 0 var(--gris-osc);
  padding:2px;
  display:flex; flex-direction:column;
  min-width:260px; min-height:160px;
}
.barra-titulo{
  height:18px; flex:0 0 18px;
  background:linear-gradient(90deg,#000080,#1084d0);
  display:flex; align-items:center; gap:3px; padding:0 2px 0 3px;
  cursor:default;
}
.ventana.inactiva .barra-titulo{background:linear-gradient(90deg,#808080,#b5b5b5)}
.barra-titulo .tit{
  color:#fff; font-weight:bold; flex:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.barra-titulo svg,.barra-titulo img{width:16px;height:16px}
.ventana.inactiva .barra-titulo .tit{color:var(--gris)}
img.ico{image-rendering:pixelated;flex:none}
.item.sel img.ico,.icono-escritorio.activo img.ico{filter:sepia(1) hue-rotate(185deg) saturate(4.5) brightness(.78)}
.btn-tit{
  width:16px;height:14px; background:var(--gris);
  border:1px solid; border-color:var(--gris-claro) var(--negro) var(--negro) var(--gris-claro);
  box-shadow:inset 1px 1px 0 var(--blanco), inset -1px -1px 0 var(--gris-osc);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;line-height:1;font-weight:bold;padding-bottom:1px;
}
.btn-tit img{width:12px;height:10px;image-rendering:pixelated}
.btn-tit:active{border-color:var(--negro) var(--gris-claro) var(--gris-claro) var(--negro);box-shadow:inset 1px 1px 0 var(--gris-osc)}
.btn-tit.cerrar{margin-left:2px}

/* --- Bandas tipo rebar (menú, herramientas, dirección) --- */
.gripper{
  align-self:stretch; flex:0 0 3px; margin:2px 4px 2px 1px;
  border:1px solid;
  border-color:var(--blanco) var(--gris-osc) var(--gris-osc) var(--blanco);
}
.banda-sep{border-top:1px solid var(--gris-osc);box-shadow:inset 0 1px 0 var(--blanco)}

/* --- Barra de menús --- */
.menus{display:flex;align-items:center;gap:0;padding:1px 2px;flex:0 0 auto}
.menus{flex-wrap:wrap}
.menus .mn{padding:1px 5px 2px;border:1px solid transparent;white-space:nowrap}
/* En el Explorador de Win98 los menús se levantan al pasar el mouse,
   no se pintan de azul (eso era para el resto de las aplicaciones). */
.menus .mn:hover{border-color:var(--blanco) var(--gris-osc) var(--gris-osc) var(--blanco)}
.menus .mn:active{border-color:var(--gris-osc) var(--blanco) var(--blanco) var(--gris-osc)}
.menus u{text-decoration:underline}
.bandera{margin-left:auto;padding:0 4px;display:flex;align-items:center}
.bandera img,.bandera svg{width:16px;height:16px;image-rendering:pixelated}

/* --- Barra de herramientas --- */
.herramientas{
  display:flex;align-items:center;gap:2px;padding:2px;
  flex:0 0 auto; flex-wrap:wrap;
}
/* Botones estándar del Explorador: ícono arriba, rótulo abajo */
.bh{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-width:42px;padding:4px 5px 3px;background:transparent;border:1px solid transparent;
  color:#000;
}
.bh:hover:not([disabled]){
  border-color:var(--blanco) var(--gris-osc) var(--gris-osc) var(--blanco);
}
.bh:active:not([disabled]){border-color:var(--gris-osc) var(--blanco) var(--blanco) var(--gris-osc)}
.bh[disabled]{color:var(--gris-osc);text-shadow:1px 1px 0 #fff}
.bh svg,.bh img{width:20px;height:20px}
.bh[disabled] svg,.bh[disabled] img{
  opacity:.6;filter:grayscale(1) contrast(.5) brightness(1.25) drop-shadow(1px 1px 0 var(--blanco));
}
/* Íconos reales de la barra del Explorador (tira original vendorizada):
   grises en reposo, a color al pasar el mouse, como en IE4/Win98. */
.tico{
  width:20px;height:20px;flex:0 0 20px;
  background:url("img/vendor/win98/barra-explorador-gris.png") no-repeat;
  image-rendering:pixelated;
}
.bh:hover:not([disabled]) .tico{background-image:url("img/vendor/win98/barra-explorador.png")}
.bh[disabled] .tico{opacity:.45;filter:saturate(0) drop-shadow(1px 1px 0 var(--blanco))}
/* Flecha desplegable anexa (Atrás, Adelante, Vistas) */
.bh-menu{
  min-width:13px;width:13px;padding:0;align-self:stretch;
  margin-left:-2px;justify-content:center;
}
.bh-menu svg{width:8px;height:5px}
.bh-menu[disabled] svg{opacity:.55;filter:none}
.separador{width:2px;align-self:stretch;margin:2px 3px;border-left:1px solid var(--gris-osc);border-right:1px solid var(--blanco)}

/* --- Barra de direcciones --- */
.direccion{display:flex;align-items:center;gap:4px;padding:2px 4px 2px 2px;flex:0 0 auto}
.direccion .campo{
  flex:1;display:flex;align-items:center;gap:4px;padding:0 0 0 3px;height:22px;
}
.direccion .campo svg,.direccion .campo img{width:16px;height:16px;flex:0 0 16px;image-rendering:pixelated}
.direccion .campo .ruta{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-desplegable{
  width:16px;flex:0 0 16px;align-self:stretch;
  display:flex;align-items:center;justify-content:center;
}
.btn-desplegable svg{width:8px;height:5px}
.btn-desplegable[disabled] svg{opacity:.55}

/* --- Cuerpo del explorador: Web View de Win98 ---
   Una sola superficie blanca, como la página web incrustada del original.
   Las nubes (wvleft) y la línea del título (wvline) son los gráficos
   originales de C:\WINDOWS\WEB, tal como los usaba FOLDER.HTT:
   background: white URL(wvleft.bmp) no-repeat  +  wvline.gif al 100%. */
.cuerpo{
  flex:1;display:flex;min-height:0;margin:2px;
  overflow:auto;
  background:#fff url("img/vendor/win98/wvleft.png") no-repeat left top;
}
.panel-web{
  flex:0 0 250px; padding:10px 16px 14px; position:relative;
}
.pw-ico{display:block;margin-bottom:2px}
.pw-ico img,.pw-ico svg{width:32px;height:32px;image-rendering:pixelated}
.pw-titulo{
  font-family:Verdana,Tahoma,sans-serif; font-size:21px; font-weight:bold;
  color:#000; line-height:1.1; margin-bottom:4px; word-break:break-word;
  letter-spacing:-.5px;
}
.pw-linea{
  height:1px;margin-bottom:14px;
  background:#000 url("img/vendor/win98/wvline.png");
  background-size:100% 1px;
}
.pw-nombre{font-weight:bold;margin-bottom:5px;color:#000080}
.pw-desc{line-height:1.55;color:#000}
.pw-meta{margin-top:10px;line-height:1.6;color:#333}
.pw-meta b{color:#000}
.pw-hint{color:#000;line-height:1.5}

.panel-iconos{
  flex:1; padding:8px 4px;
  display:flex; flex-wrap:wrap; align-content:flex-start; gap:2px;
}
.item{
  width:86px; padding:5px 3px; display:flex; flex-direction:column;
  align-items:center; gap:4px; text-align:center;
}
.item svg,.item img{width:32px;height:32px}
.marco-ico{position:relative;width:32px;height:32px;display:block}
.marco-ico .atajo{
  position:absolute;left:-2px;bottom:-2px;width:12px;height:12px;
  background:#fff;border:1px solid #000;display:flex;align-items:center;justify-content:center;
}
.marco-ico .atajo svg{width:9px!important;height:9px!important}
.pw-enlaces{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.pw-enlaces a{color:#000080;display:flex;align-items:center;gap:5px;text-decoration:none}
.pw-enlaces a:hover{text-decoration:underline}
.pw-enlaces a img,.pw-enlaces a svg{width:16px;height:16px}
.item .etq{padding:1px 3px;line-height:1.3;word-break:break-word}
.item.sel .etq{background:var(--sel);color:#fff;outline:1px dotted #000;outline-offset:-1px}
.item.sel .marco{filter:hue-rotate(180deg) saturate(1.4) brightness(.85)}

/* --- Barra de estado --- */
.estado{display:flex;gap:2px;padding:2px 0 0 2px;flex:0 0 auto}
.estado div{
  padding:2px 5px;
  border:1px solid; border-color:var(--gris-osc) var(--blanco) var(--blanco) var(--gris-osc);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.estado .e1{flex:1}
.estado .e2{flex:0 0 110px;display:flex;align-items:center;gap:4px}
.estado .e2 img,.estado .e2 svg{width:16px;height:16px;image-rendering:pixelated}
.estado .grip{
  flex:0 0 13px;border:none;padding:0;position:relative;
}
.estado .grip::after{
  content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;
  background:repeating-linear-gradient(135deg,
    transparent 0 2px, var(--blanco) 2px 3px, var(--gris-osc) 3px 5px);
  clip-path:polygon(100% 0,100% 100%,0 100%);
}

/* --- Documento (ventana de contenido) --- */
.doc{
  flex:1; margin:2px; background:#fff; overflow:auto; padding:18px 22px;
  border:1px solid; border-color:var(--gris-osc) var(--blanco) var(--blanco) var(--gris-osc);
  box-shadow:inset 1px 1px 0 var(--negro);
  user-select:text; line-height:1.6; font-size:12px;
}
.doc h1{font-family:Verdana,sans-serif;font-size:17px;margin-bottom:2px}
.doc h2{
  font-family:Verdana,sans-serif;font-size:12px;margin:18px 0 6px;
  color:#000080;border-bottom:1px solid #c0c0c0;padding-bottom:3px;letter-spacing:.3px;
}
.doc .sub{color:#555;margin-bottom:14px}
.doc p{margin-bottom:9px}
.doc ul{margin:0 0 10px 18px}
.doc li{margin-bottom:4px}
.doc .cargo{font-weight:bold}
.doc .fecha{color:#666;font-size:11px}
.doc .bloque{margin-bottom:14px}
.doc .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.doc .tag{
  background:#c0c0c0;padding:2px 6px;font-size:10px;
  border:1px solid;border-color:#fff #808080 #808080 #fff;
}
.doc a{color:#0000cc}
.doc table{border-collapse:collapse;width:100%;margin-bottom:10px;font-size:11px}
.doc td{padding:3px 6px;border:1px solid #d4d4d4;vertical-align:top}
.doc td:first-child{width:34%;font-weight:bold;background:#f2f2f2}

/* ============================================================
   BARRA DE TAREAS
   ============================================================ */
#barra-tareas{
  position:absolute;left:0;right:0;bottom:0;height:28px;
  background:var(--gris);border-top:1px solid var(--blanco);
  display:flex;align-items:center;gap:3px;padding:2px 3px;z-index:99999;
}
#inicio{
  display:flex;align-items:center;gap:4px;font-weight:bold;
  padding:2px 6px 3px 4px;height:22px;
}
#inicio svg,#inicio img{width:16px;height:16px}
.tarea{
  height:22px;min-width:130px;max-width:170px;display:flex;align-items:center;gap:4px;
  padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.tarea svg,.tarea img{width:16px;height:16px;flex:0 0 16px;image-rendering:pixelated}
.tarea span{overflow:hidden;text-overflow:ellipsis}
.tarea.activa{font-weight:bold}
#bandeja{
  margin-left:auto;display:flex;align-items:center;gap:6px;padding:2px 8px;height:22px;
  border:1px solid;border-color:var(--gris-osc) var(--blanco) var(--blanco) var(--gris-osc);
}

/* --- Menú Inicio --- */
#menu-inicio{
  position:absolute;bottom:28px;left:3px;width:220px;display:none;z-index:99998;
  padding:2px;
}
#menu-inicio.abierto{display:flex}
.banner{
  flex:0 0 22px;background:linear-gradient(0deg,#000080,#1084d0);
  writing-mode:vertical-rl;transform:rotate(180deg);
  color:#fff;font-family:Verdana,sans-serif;font-size:15px;font-weight:bold;
  display:flex;align-items:flex-start;justify-content:flex-end;padding:8px 3px;
  letter-spacing:-.5px;
}
.banner i{font-weight:normal;font-style:normal;font-size:11px}
.mi-lista{flex:1;display:flex;flex-direction:column;padding:2px 0}
.mi-item{display:flex;align-items:center;gap:8px;padding:5px 8px;color:#000}
.mi-item svg,.mi-item img{width:22px;height:22px;flex:0 0 22px}
.mi-item:hover{background:var(--sel);color:#fff}
.mi-item .flecha{margin-left:auto;font-size:9px}
.mi-sep{height:1px;background:var(--gris-osc);border-bottom:1px solid #fff;margin:3px 4px}

/* --- Diálogo --- */
#capa{position:absolute;inset:0;display:none;z-index:99997}
#capa.visible{display:block}
/* El centrado se hace en JS con left/top en píxeles: si se centrara con
   transform:translate(-50%,-50%), al arrastrar (que fija left/top) el
   diálogo saltaría media ventana por el transform aún aplicado. */
.dialogo{position:absolute;width:300px}
.dlg-cuerpo{padding:16px 14px;display:flex;gap:12px;align-items:flex-start}
.dlg-cuerpo svg,.dlg-cuerpo img{width:32px;height:32px;flex:0 0 32px}
.dlg-btns{display:flex;justify-content:center;gap:8px;padding:0 10px 12px}
.dlg-btns button{padding:4px 0;width:74px;height:23px}

/* --- Apagado --- */
#apagado{
  position:absolute;inset:0;background:#000;display:none;z-index:100000;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
}
#apagado.visible{display:flex}
#apagado h2{color:#ff9c00;font-family:Verdana,sans-serif;font-size:22px;text-align:center;padding:0 20px}
#apagado p{color:#909090;font-size:11px}

/* ============================================================
   SECUENCIA DE ARRANQUE
   ============================================================ */
#arranque{
  position:absolute;inset:0;background:#000;z-index:200000;
  display:none;flex-direction:column;cursor:default;
}
#bios{
  flex:1;font-family:"Courier New",Courier,monospace;font-size:13.5px;
  color:#d8d8d8;padding:16px 20px;line-height:1.5;position:relative;
  overflow:hidden;
}
#bios div{white-space:pre-wrap}
#bios .marca{color:#fff}
#bios .ok{color:#5ee05e}
#bios .cursor{
  display:inline-block;width:8px;height:14px;background:#d8d8d8;
  vertical-align:text-bottom;animation:parpadeo 1s steps(1) infinite;
}
@keyframes parpadeo{50%{opacity:0}}
#estrella{
  position:absolute;top:14px;right:20px;width:54px;height:54px;opacity:.9;
}
#pie-bios{
  font-family:"Courier New",monospace;font-size:12px;color:#8a8a8a;
  padding:0 20px 14px;
}

#splash{
  position:absolute;inset:0;background:#000;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:26px;
}
#splash.visible{display:flex}
.splash-marca{display:flex;align-items:center;gap:22px;padding:0 24px}
.splash-marca svg{width:96px;height:96px;flex:0 0 96px}
.splash-txt{display:flex;flex-direction:column;gap:2px}
.splash-txt .pequeno{
  font-family:Verdana,Arial,sans-serif;font-size:15px;color:#dfdfdf;letter-spacing:.5px;
}
.splash-txt .grande{
  font-family:Verdana,Arial,sans-serif;font-size:46px;font-weight:bold;color:#fff;
  line-height:1;letter-spacing:-1.5px;
}
.splash-txt .lema{
  font-family:Verdana,Arial,sans-serif;font-size:12px;color:#8fb8dc;margin-top:8px;
}
#barra-carga{
  position:absolute;left:0;right:0;bottom:0;height:22px;overflow:hidden;background:#000;
}
#barra-carga::after{
  content:"";position:absolute;top:0;bottom:0;width:45%;
  background:linear-gradient(90deg,transparent,#062a5e 15%,#1084d0 45%,#9fdcff 62%,#1084d0 78%,transparent);
  animation:barrer 1.9s linear infinite;
}
@keyframes barrer{from{left:-45%}to{left:100%}}
#omitir{
  position:absolute;bottom:30px;right:18px;
  font-family:"Courier New",monospace;font-size:11px;color:#6e6e6e;
}

  <p>Me interesa especialmente el problema de la <b>última milla</b> del dato geoespacial: no basta con tener la capa correcta si nadie puede abrirla. Por eso la mayoría de mis herramientas son archivos HTML autocontenidos que funcionan sin servidor, sin instalación y sin conexión — se abren con doble clic y listo.</p>

<template data-doc="generador-censal">
  <h1>Generador de visores censales</h1>
  <p class="sub">INE O'Higgins · Herramienta interna</p>
  <h2>El problema</h2>
  <p>Cada requerimiento de datos censales a nivel de manzana terminaba en un archivo plano que el solicitante no podía interpretar espacialmente. Producir un visor a medida por cada solicitud no escalaba.</p>
  <h2>La solución</h2>
  <p>Un generador que recibe el GeoJSON y la configuración del requerimiento, y devuelve un visor HTML completo y autónomo, listo para enviar por correo.</p>
  <ul>
    <li>Detección automática de EPSG y reproyección con proj4js.</li>
    <li>Coropleta por cuantiles con tratamiento explícito de "sin datos".</li>
    <li>Indicadores configurables y renombrado de campos técnicos a nombres legibles.</li>
    <li>Plantilla del visor incrustada, sin dependencias externas.</li>
  </ul>
  <div class="tags"><span class="tag">JavaScript</span><span class="tag">MapLibre GL JS</span><span class="tag">proj4js</span><span class="tag">GeoJSON</span></div>
</template>

<template data-doc="ipc">
  <h1>Sistema de visores de terreno IPC</h1>
  <p class="sub">INE O'Higgins · Dos generaciones (V1 → V2)</p>
  <p>Herramienta que produce visores autocontenidos para la recolección en terreno del IPC, pensados para funcionar en equipos sin conexión ni permisos de instalación.</p>
  <h2>Decisiones de diseño</h2>
  <ul>
    <li>Filtros multiselección por semana de recolección.</li>
    <li>Mapas base vectoriales con marcadores HTML en lugar de capas de símbolos GPU: la carga de glifos falla al abrir desde el disco, y la fidelidad visual no era negociable.</li>
    <li>Paginador para puntos que agrupan varios registros en la misma coordenada.</li>
  </ul>
  <h2>Aprendizaje</h2>
  <p>La restricción técnica más dura resultó ser la más productiva: diseñar para que funcione sin servidor obliga a decisiones honestas sobre peso, dependencias y carga cognitiva.</p>

function abrirEnlace(url){
  if(!url) return;
  window.open(url, "_blank", "noopener,noreferrer");
}

function filaEnlaces(it){
  const enlaces = [];
  if(it.repo) enlaces.push(["repo","Ver el código", it.repo]);
  if(it.demo) enlaces.push(["web","Abrir la herramienta", it.demo]);
  if(!enlaces.length) return "";

    `<a href="${u}" target="_blank" rel="noopener noreferrer">${ico(k,"p")}${txt}</a>`
  ).join("") + `</div>`;
}

const ico = (k, tam) => {
  const png = window.ICONOS_PNG && window.ICONOS_PNG[k];
  if(png) return `<img class="ico" src="${png[tam === "p" ? "p" : "g"]}" alt="">`;
  return ICONOS[k] || ICONOS.doc;
};

/* ============================================================
   3. GESTOR DE VENTANAS
   ============================================================ */
let z = 100, idVentana = 0;
const ventanas = new Map();

function crearVentana({titulo, icono, ancho, alto, x, y, contenido, clase=""}){
  const id = "v" + (++idVentana);
  const w = document.createElement("div");
  w.className = "ventana " + clase;
  w.id = id;
  const maxA = Math.min(ancho, window.innerWidth - 20);
  const maxH = Math.min(alto, window.innerHeight - 60);
  w.style.width = maxA + "px";
  w.style.height = maxH + "px";
  w.style.left = (x ?? Math.max(8, (window.innerWidth - maxA)/2 + (idVentana%5)*16)) + "px";
  w.style.top  = (y ?? Math.max(8, (window.innerHeight - 28 - maxH)/2 + (idVentana%5)*16)) + "px";
  w.style.zIndex = ++z;

  w.innerHTML = `
    <div class="barra-titulo">
      ${ico(icono, "p")}
      <div class="tit">${titulo}</div>
      <button class="btn-tit" data-a="min" title="Minimizar"><img src="img/vendor/os-gui/botones/minimizar.png" alt=""></button>
      <button class="btn-tit" data-a="max" title="Maximizar"><img src="img/vendor/os-gui/botones/maximizar.png" alt=""></button>
      <button class="btn-tit cerrar" data-a="cerrar" title="Cerrar"><img src="img/vendor/os-gui/botones/cerrar.png" alt=""></button>
    </div>`;
  w.appendChild(contenido);
  document.body.appendChild(w);

  ventanas.set(id, {el:w, titulo, icono, minimizada:false, restaurar:null});
  arrastrable(w);
  w.addEventListener("mousedown", () => enfocar(id));
  w.querySelector('[data-a="cerrar"]').onclick = e => {e.stopPropagation(); cerrar(id);};
  w.querySelector('[data-a="min"]').onclick   = e => {e.stopPropagation(); minimizar(id);};
  w.querySelector('[data-a="max"]').onclick   = e => {e.stopPropagation(); maximizar(id);};
  w.querySelector(".barra-titulo").addEventListener("dblclick", () => maximizar(id));

  enfocar(id);
  pintarTareas();
  return {id, el:w};
}

function enfocar(id){
  const v = ventanas.get(id); if(!v) return;
  v.el.style.zIndex = ++z;
  if(v.minimizada){ v.minimizada = false; v.el.style.display = "flex"; }
  ventanas.forEach((o,k)=> o.el.classList.toggle("inactiva", k !== id));
  pintarTareas();
}
function cerrar(id){
  const v = ventanas.get(id); if(!v) return;
  v.el.remove(); ventanas.delete(id); pintarTareas();
}
function minimizar(id){
  const v = ventanas.get(id); if(!v) return;
  v.minimizada = true; v.el.style.display = "none";
  v.el.classList.add("inactiva"); pintarTareas();
}
function maximizar(id){
  const v = ventanas.get(id); if(!v) return;
  const img = v.el.querySelector('[data-a="max"] img');
  if(v.restaurar){
    Object.assign(v.el.style, v.restaurar); v.restaurar = null;
    if(img) img.src = "img/vendor/os-gui/botones/maximizar.png";
  }else{
    v.restaurar = {left:v.el.style.left, top:v.el.style.top, width:v.el.style.width, height:v.el.style.height};
    Object.assign(v.el.style, {left:"0px", top:"0px", width:"100%", height:"calc(100% - 28px)"});
    if(img) img.src = "img/vendor/os-gui/botones/restaurar.png";
  }
}
function arrastrable(w){
  const barra = w.querySelector(".barra-titulo");
  const iniciar = (px,py) => {
    const r = w.getBoundingClientRect();
    const dx = px - r.left, dy = py - r.top;
    const mover = (mx,my) => {
      w.style.left = Math.min(Math.max(-r.width+60, mx-dx), window.innerWidth-60) + "px";
      w.style.top  = Math.min(Math.max(0, my-dy), window.innerHeight-56) + "px";
    };
    const mm = e => mover(e.clientX, e.clientY);
    const mt = e => { e.preventDefault(); mover(e.touches[0].clientX, e.touches[0].clientY); };
    const fin = () => {
      document.removeEventListener("mousemove", mm); document.removeEventListener("mouseup", fin);
      document.removeEventListener("touchmove", mt); document.removeEventListener("touchend", fin);
    };
    document.addEventListener("mousemove", mm); document.addEventListener("mouseup", fin);
    document.addEventListener("touchmove", mt, {passive:false}); document.addEventListener("touchend", fin);
  };
  barra.addEventListener("mousedown", e => { if(e.target.closest(".btn-tit")) return; iniciar(e.clientX, e.clientY); });
  barra.addEventListener("touchstart", e => { if(e.target.closest(".btn-tit")) return; iniciar(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
}

function pintarTareas(){
  const cont = document.getElementById("tareas");
  cont.innerHTML = "";
  ventanas.forEach((v,id) => {
    const b = document.createElement("button");
    const activa = !v.minimizada && !v.el.classList.contains("inactiva");
    b.className = "tarea out" + (activa ? " activa presionado" : "");
    b.innerHTML = ico(v.icono, "p") + `<span>${v.titulo}</span>`;
    b.onclick = () => { activa ? minimizar(id) : enfocar(id); };
    cont.appendChild(b);
  });
}

      <div class="separador"></div>
      <button class="bh" data-gen="Cortar">${tico(21)}<span class="rotulo">Cortar</span></button>
      <button class="bh" data-gen="Copiar">${tico(22)}<span class="rotulo">Copiar</span></button>
      <button class="bh" data-gen="Pegar">${tico(23)}<span class="rotulo">Pegar</span></button>
      <div class="separador"></div>
      <button class="bh" data-gen="Deshacer">${tico(24)}<span class="rotulo">Deshacer</span></button>
      <button class="bh" data-gen="Eliminar">${tico(26)}<span class="rotulo">Eliminar</span></button>
      <button class="bh" data-gen="Propiedades">${tico(31)}<span class="rotulo">Propiedades</span></button>
      <div class="separador"></div>
      <button class="bh" data-n="vistas">${tico(38)}<span class="rotulo">Vistas</span></button>
      <button class="bh bh-menu" data-n="vistas">${flechita}</button>
    </div>
    <div class="direccion banda-sep">
      <div class="gripper"></div>
      <span>Direcci&oacute;n</span>
      <div class="campo in">${ico("carpeta","p")}<span class="ruta">C:\\Portafolio</span>
        <button class="btn-desplegable out" disabled title="Direcciones recientes">
          ${flechita}
        </button>
      </div>
    </div>
    <div class="cuerpo in">
      <div class="panel-web">
        <span class="pw-ico"></span>
        <div class="pw-titulo"></div>
        <div class="pw-linea"></div>
        <div class="pw-cont"></div>
      </div>
      <div class="panel-iconos"></div>
    </div>
    <div class="estado">
      <div class="e1">0 objeto(s)</div>
      <div class="e2">${ico("pc","p")}<span>Mi PC</span></div>
    </div>`;

  const {id, el} = crearVentana({
    titulo:"Portafolio", icono:"carpeta",
    ancho:720, alto:470, contenido:cuerpo
  });

  const estado = { historial:[null], pos:0 };
  const q = s => el.querySelector(s);

  function render(){
    const carp = estado.historial[estado.pos];
    const datos = carp ? CONFIG.carpetas.find(c => c.id === carp) : null;
    const lista = (datos ? datos.items : CONFIG.carpetas).filter(x => !x.oculto);
    fijarHash(datos ? "#" + datos.id : "");

    q(".ruta").textContent = "C:\\Portafolio" + (datos ? "\\" + datos.nombre : "");
    el.querySelector(".tit").textContent = datos ? datos.nombre : "Portafolio";
    ventanas.get(id).titulo = datos ? datos.nombre : "Portafolio";
    q(".e1").textContent = lista.length + " objeto(s)";
    q('[data-n="atras"]').disabled = estado.pos === 0;
    q('[data-n="atras-m"]').disabled = estado.pos === 0;
    q('[data-n="adelante"]').disabled = estado.pos === estado.historial.length - 1;
    q('[data-n="adelante-m"]').disabled = estado.pos === estado.historial.length - 1;
    q('[data-n="arriba"]').disabled = !carp;

    // panel web por defecto
    infoCarpeta(datos);

    const cont = q(".panel-iconos");
    cont.innerHTML = "";
    lista.forEach((it, i) => {
      const d = document.createElement("div");
      d.className = "item";
      d.tabIndex = 0;
      const esAtajo = !!(it.repo || it.demo);
      d.innerHTML = `<span class="marco-ico">${ico(it.icono)}${esAtajo ? BADGE : ""}</span>`
                  + `<div class="etq">${it.nombre}</div>`;
      const seleccionar = () => {
        cont.querySelectorAll(".item").forEach(x => x.classList.remove("sel"));
        d.classList.add("sel");
        infoItem(it, datos, !carp);
      };
      const abrir = () => {
        if(!carp) navegar(it.id);
        else abrirDocumento(it, carp);
      };
      d.onclick = seleccionar;
      d.ondblclick = abrir;
      d.onkeydown = e => { if(e.key === "Enter") abrir(); if(e.key === " "){e.preventDefault(); seleccionar();} };
      cont.appendChild(d);
    });
    pintarTareas();
  }

  function infoCarpeta(datos){
    q(".pw-ico").innerHTML = ico(datos ? (datos.icono || "carpeta") : "carpeta");
    q(".pw-titulo").textContent = datos ? datos.nombre : "Portafolio";
    q(".pw-cont").innerHTML = datos
      ? `<div class="pw-desc">${datos.desc}</div>
         <div class="pw-hint" style="margin-top:12px">Seleccione un elemento para ver su descripción.</div>`
      : `<div class="pw-desc"><b>${CONFIG.usuario.nombre}</b> — ${CONFIG.usuario.titulo}<br>${CONFIG.usuario.lugar}</div>
         <div class="pw-hint" style="margin-top:12px">Seleccione un elemento para ver su descripción.</div>`;
  }

  function infoItem(it, datos, esCarpeta){
    q(".pw-titulo").textContent = datos ? datos.nombre : "Portafolio";
    q(".pw-cont").innerHTML = `
      <div class="pw-nombre">${it.nombre}</div>
      <div class="pw-desc">${it.desc}</div>
      <div class="pw-meta">
        <b>Tipo:</b> ${esCarpeta ? "Carpeta de archivos" : (it.repo || it.demo) ? "Acceso directo" : "Documento"}<br>
        <b>${esCarpeta ? "Contiene" : "Acción"}:</b> ${esCarpeta ? it.items.length + " elemento(s)" : "Doble clic para abrir"}
      </div>
      ${filaEnlaces(it)}`;
  }

  function navegar(idc){
    estado.historial = estado.historial.slice(0, estado.pos + 1);
    estado.historial.push(idc);
    estado.pos++;
    render();
  }

  q('[data-n="atras"]').onclick = () => { if(estado.pos > 0){ estado.pos--; render(); } };
  q('[data-n="adelante"]').onclick = () => { if(estado.pos < estado.historial.length-1){ estado.pos++; render(); } };
  q('[data-n="arriba"]').onclick = () => navegar(null);
  el.querySelectorAll('[data-gen]').forEach(b => b.onclick = () =>
    dialogo(b.dataset.gen, "Esta función no está disponible: los archivos del portafolio son de solo lectura.", ["Aceptar"]));
  el.querySelectorAll('[data-n="vistas"]').forEach(b => b.onclick = () =>
    dialogo("Vistas", "Iconos grandes es la única vista disponible por ahora.", ["Aceptar"]));
  q(".panel-iconos").onclick = e => {
    if(e.target.closest(".item")) return;
    e.currentTarget.querySelectorAll(".item").forEach(x => x.classList.remove("sel"));
    infoCarpeta(estado.historial[estado.pos] ? CONFIG.carpetas.find(c=>c.id===estado.historial[estado.pos]) : null);
  };

  if(idCarpeta){ estado.historial.push(idCarpeta); estado.pos = 1; }
  render();

  // permite que el enrutador cambie de carpeta en una ventana ya abierta
  ventanas.get(id).irACarpeta = idc => {
    if(estado.historial[estado.pos] === idc) return;
    navegar(idc);
  };
  return id;
}

function abrirDocumento(it, idCarpeta){
  const plantilla = document.querySelector(`template[data-doc="${it.id}"]`);

  const cuerpo = document.createElement("div");
  cuerpo.style.cssText = "display:flex;flex-direction:column;flex:1;min-height:0";
  cuerpo.innerHTML = `
    <div class="menus">
      <span class="mn"><u>A</u>rchivo</span><span class="mn"><u>E</u>dición</span><span class="mn"><u>V</u>er</span><span class="mn">A<u>y</u>uda</span>
    </div>
    <div class="herramientas banda-sep">
      <div class="gripper"></div>
      <button class="bh" data-n="imprimir">${ico("imprimir")}<span class="rotulo">Imprimir</span></button>
      <button class="bh" data-n="enlace">${ico("globo")}<span class="rotulo">Copiar enlace</span></button>
      ${it.repo ? `<div class="separador"></div><button class="bh" data-n="repo">${ico("repo")}<span class="rotulo">Ver en GitHub</span></button>` : ""}
      ${it.demo ? `<button class="bh" data-n="demo">${ico("web")}<span class="rotulo">Abrir herramienta</span></button>` : ""}
    </div>
    <div class="doc"></div>`;

  const doc = cuerpo.querySelector(".doc");
  if(plantilla){
    doc.appendChild(plantilla.content.cloneNode(true));
  }else{
    doc.innerHTML = `<h1>Documento no encontrado</h1>
      <p>Falta el bloque <b>&lt;template data-doc="${it.id}"&gt;</b> en index.html.
      Agrégalo al final del archivo, junto a los demás documentos.</p>`;
  }

  const {el} = crearVentana({
    titulo: it.titulo || it.nombre, icono: it.icono,
    ancho:600, alto:480, contenido:cuerpo
  });

  if(idCarpeta) fijarHash(`#${idCarpeta}/${it.id}`);
  el.querySelector('[data-n="imprimir"]').onclick = () => window.print();
  el.querySelector('[data-n="repo"]')?.addEventListener("click", () => abrirEnlace(it.repo));
  el.querySelector('[data-n="demo"]')?.addEventListener("click", () => abrirEnlace(it.demo));
  el.querySelector('[data-n="enlace"]').onclick = () => {
    const url = location.href.split("#")[0] + `#${idCarpeta || ""}/${it.id}`;
    navigator.clipboard?.writeText(url).then(
      () => dialogo("Copiar enlace", "Enlace copiado al portapapeles:<br><br><b>" + url.split("/").pop() + "</b>", ["Aceptar"]),
      () => dialogo("Copiar enlace", "No se pudo copiar automáticamente. La dirección es:<br><br><b>" + url + "</b>", ["Aceptar"])
    );
  };
}

/* ============================================================
   5b. ENRUTADOR POR HASH  (#carpeta  ·  #carpeta/documento)
   ============================================================ */
let hashPropio = false;

function fijarHash(h){
  if(location.hash === h) return;
  hashPropio = true;
  history.replaceState(null, "", h || location.pathname + location.search);
  setTimeout(() => { hashPropio = false; }, 0);
}

function leerHash(){
  const partes = decodeURIComponent(location.hash.replace(/^#/, "")).split("/");
  const carp = CONFIG.carpetas.find(c => c.id === partes[0]);
  if(!carp) return null;
  const item = partes[1] ? carp.items.find(i => i.id === partes[1]) : null;
  return {carp, item};
}

function aplicarHash(){
  const r = leerHash();
  if(!r) return false;
  // reutiliza un explorador abierto si lo hay
  let expl = null;
  ventanas.forEach(v => { if(v.irACarpeta && !expl) expl = v; });
  if(expl) expl.irACarpeta(r.carp.id);
  else abrirExplorador(r.carp.id);
  if(r.item) abrirDocumento(r.item, r.carp.id);
  return true;
}

window.addEventListener("hashchange", () => { if(!hashPropio) aplicarHash(); });

/* ============================================================
   6. DIÁLOGOS
   ============================================================ */
function dialogo(titulo, texto, botones, alElegir){
  const capa = document.getElementById("capa");
  capa.classList.add("visible");
  capa.innerHTML = `
    <div class="dialogo ventana" style="z-index:${++z}">
      <div class="barra-titulo">
        <div class="tit">${titulo}</div>
        <button class="btn-tit cerrar" data-r=""><img src="img/vendor/os-gui/botones/cerrar.png" alt=""></button>
      </div>
      <div class="dlg-cuerpo">${ico("aviso")}<div style="line-height:1.6;padding-top:4px">${texto}</div></div>
      <div class="dlg-btns">${botones.map(b=>`<button class="out" data-r="${b}">${b}</button>`).join("")}</div>
    </div>`;
  capa.querySelectorAll("[data-r]").forEach(b => {
    b.onclick = () => { capa.classList.remove("visible"); capa.innerHTML=""; alElegir && alElegir(b.dataset.r); };
  });
  const d = capa.querySelector(".dialogo");
  d.style.left = Math.max(8, (window.innerWidth - d.offsetWidth) / 2) + "px";
  d.style.top  = Math.max(8, window.innerHeight * .38 - d.offsetHeight / 2) + "px";
  arrastrable(d);
}

/* ============================================================
   7. ESCRITORIO, MENÚ INICIO Y RELOJ
   ============================================================ */
function pintarEscritorio(){
  const d = document.getElementById("escritorio");
  const iconos = [
    {n:"Mi Portafolio", i:"pc", a:()=>abrirExplorador()},
    ...CONFIG.carpetas.map(c => ({n:c.nombre, i:c.icono, a:()=>abrirExplorador(c.id)})),
    {n:"GitHub", i:"repo", atajo:true, a:()=>abrirEnlace("https://" + CONFIG.usuario.github)},
    {n:"Papelera de reciclaje", i:"papelera", a:()=>dialogo("Papelera de reciclaje","La papelera está vacía. Los proyectos fallidos se archivan como aprendizajes.",["Aceptar"])}
  ];
  iconos.forEach(it => {
    const e = document.createElement("div");
    e.className = "icono-escritorio";
    e.tabIndex = 0;
    e.innerHTML = `<span class="marco-ico">${ico(it.i)}${it.atajo ? BADGE : ""}</span><span class="etq">${it.n}</span>`;
    e.onclick = () => {
      d.querySelectorAll(".icono-escritorio").forEach(x=>x.classList.remove("activo"));
      e.classList.add("activo");
    };
    e.ondblclick = it.a;
    e.onkeydown = ev => { if(ev.key === "Enter") it.a(); };
    d.appendChild(e);
  });
  d.onclick = e => { if(e.target === d) d.querySelectorAll(".icono-escritorio").forEach(x=>x.classList.remove("activo")); };
}

function pintarMenuInicio(){
  const l = document.getElementById("mi-lista");
  const items = [
    {n:"Programas", i:"carpeta", flecha:true, a:()=>abrirExplorador("proyectos")},
    {n:"Documentos", i:"doc", flecha:true, a:()=>abrirExplorador("perfil")},
    {n:"Habilidades", i:"herramienta", a:()=>abrirExplorador("habilidades")},
    {sep:true},
    {n:"Buscar", i:"buscar", a:()=>dialogo("Buscar","Usa el explorador para recorrer las carpetas del portafolio.",["Aceptar"])},
    {n:"Ayuda", i:"ayuda", a:()=>abrirExplorador("perfil")},
    {sep:true},
    {n:"Contactar...", i:"correo", a:()=>abrirExplorador("contacto")},
    {n:"Ir a GitHub", i:"repo", a:()=>abrirEnlace("https://" + CONFIG.usuario.github)},
    {n:"Apagar...", i:"apagar", a:()=>dialogo(
      "Cerrar Windows",
      "¿Qué quieres hacer?",
      ["Apagar","Reiniciar","Cancelar"],
      r => { if(r==="Apagar") apagar(); if(r==="Reiniciar") reiniciar(); }
    )}
  ];
  items.forEach(it => {
    if(it.sep){ const s = document.createElement("div"); s.className="mi-sep"; l.appendChild(s); return; }
    const b = document.createElement("button");
    b.className = "mi-item";
    b.style.cssText = "background:none;border:none;text-align:left;width:100%";
    b.innerHTML = ico(it.i) + `<span>${it.n}</span>` + (it.flecha ? `<span class="flecha">▶</span>` : "");
    b.onclick = () => { cerrarInicio(); it.a(); };
    l.appendChild(b);
  });
}

const btnInicio = document.getElementById("inicio");
const menuInicio = document.getElementById("menu-inicio");
btnInicio.innerHTML = ico("inicio","p") + "<span>Inicio</span>";
btnInicio.onclick = e => {
  e.stopPropagation();
  const abierto = menuInicio.classList.toggle("abierto");
  btnInicio.classList.toggle("presionado", abierto);
};
function cerrarInicio(){ menuInicio.classList.remove("abierto"); btnInicio.classList.remove("presionado"); }
document.addEventListener("click", e => { if(!menuInicio.contains(e.target) && e.target !== btnInicio) cerrarInicio(); });

function apagar(){
  const p = document.getElementById("apagado");
  p.classList.add("visible");
  p.onclick = () => p.classList.remove("visible");
}

function reloj(){
  const d = new Date();
  const h = d.getHours(), m = String(d.getMinutes()).padStart(2,"0");
  const ap = h < 12 ? "a.m." : "p.m.";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  document.getElementById("reloj").textContent = `${h12}:${m} ${ap}`;
}

/* ============================================================
   8. SECUENCIA DE ARRANQUE
   ============================================================ */
let omitirBoot = false;

function pausa(ms){
  return new Promise(res => {
    if(omitirBoot) return res();
    const t = setTimeout(() => { clearInterval(chk); res(); }, ms);
    const chk = setInterval(() => {
      if(omitirBoot){ clearTimeout(t); clearInterval(chk); res(); }
    }, 30);
  });
}

async function arrancar(){
  const capa   = document.getElementById("arranque");
  const bios   = document.getElementById("bios");
  const pie    = document.getElementById("pie-bios");
  const splash = document.getElementById("splash");
  const hint   = document.getElementById("omitir");

  omitirBoot = false;
  capa.style.display = "flex";
  splash.classList.remove("visible");
  bios.style.display = "block";
  pie.style.display = "block";
  hint.style.display = "block";
  bios.querySelectorAll("div").forEach(d => d.remove());
  pie.textContent = "";

  const saltar = () => { omitirBoot = true; };
  document.addEventListener("keydown", saltar, {once:true});
  capa.addEventListener("click", saltar, {once:true});

  const linea = (txt, clase="") => {
    const d = document.createElement("div");
    d.className = clase;
    d.innerHTML = txt;
    bios.appendChild(d);
    return d;
  };

  // ---- POST del BIOS ----
  linea('<span class="marca">Award Modular BIOS v4.51PG</span>');
  linea('Copyright (C) 1984-98, Award Software, Inc.');
  linea('&nbsp;');
  await pausa(500);

  linea('<span class="marca">PORTAFOLIO BIOS (2026) — EDICIÓN CARTOGRÁFICA</span>');
  linea('&nbsp;');
  await pausa(400);

  linea('Procesador principal : Pentium II MMX 350 MHz');
  await pausa(260);

  const mem = linea('Prueba de memoria :        0K');
  const total = 65536;
  const paso = 4096;
  for(let k = paso; k <= total; k += paso){
    if(omitirBoot) break;
    mem.innerHTML = `Prueba de memoria : ${String(k).padStart(8," ")}K`;
    await pausa(55);
  }
  mem.innerHTML = `Prueba de memoria : ${String(total).padStart(8," ")}K <span class="ok">OK</span>`;
  await pausa(350);
  linea('&nbsp;');

  const dispositivos = [
    ['Detectando IDE maestro primario   ', 'DISCO-GIS 40GB'],
    ['Detectando IDE esclavo primario   ', 'Ninguno'],
    ['Detectando IDE maestro secundario ', 'CD-ROM 24X'],
    ['Detectando coprocesador QGIS      ', 'OK'],
    ['Verificando proyecciones          ', 'EPSG cargado']
  ];
  for(const [etq, val] of dispositivos){
    if(omitirBoot) break;
    const d = linea(etq + '... ');
    await pausa(230);
    d.innerHTML = etq + '... <span class="ok">' + val + '</span>';
    await pausa(120);
  }

  await pausa(400);
  if(!omitirBoot){
    linea('&nbsp;');
    linea('Iniciando Nel 98... <span class="cursor"></span>');
    pie.textContent = "Presiona SUPR para entrar a SETUP  ·  29/07/2026";
    await pausa(1100);
  }

  // ---- Pantalla de carga ----
  bios.style.display = "none";
  pie.style.display = "none";
  hint.style.display = "none";
  splash.classList.add("visible");
  await pausa(omitirBoot ? 700 : 2400);

  // ---- Escritorio ----
  capa.style.display = "none";
  splash.classList.remove("visible");
  if(!ventanas.size && !aplicarHash()) abrirExplorador();
}

function reiniciar(){
  ventanas.forEach((v,id) => cerrar(id));
  document.getElementById("apagado").classList.remove("visible");
  arrancar();
}

/* ============================================================
   9. INICIALIZACIÓN
   ============================================================ */
pintarEscritorio();
pintarMenuInicio();
reloj(); setInterval(reloj, 15000);
document.addEventListener("contextmenu", e => e.preventDefault());

if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  if(!aplicarHash()) abrirExplorador();
}else{
  arrancar();
}
</script>
